# ISO64 VIC-20 engine, PAL with 32K expansion (blocks 1-3).
# The PRG starts at $1201 (BASIC start with RAM expansion) with a SYS stub;
# the gap up to $2000 is padding that the screens and character set reuse.
MEMORY {
    ZP:       file = "", start = $0060, size = $0030;
    LOADADDR: file = %O, start = $11ff, size = $0002;
    STUB:     file = %O, start = $1201, size = $0dff, fill = yes;
    MAIN:     file = %O, start = $2000, size = $14e8;              # labels CLS_A/CLS_B above
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STUB:     load = STUB,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
}
